# Robot de publication d'Échappée.
# Il tourne : à chaque modification envoyée sur GitHub, toutes les heures
# (pour rafraîchir les actus), ou à la main (onglet Actions → « Run workflow »).
# Il ne faut normalement jamais modifier ce fichier.

name: Publier Échappée

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"      # toutes les heures, à h17
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write              # pour la « réactivation » automatique (voir plus bas)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer feedparser (lecture des flux RSS)
        run: pip install "feedparser==6.*"

      - name: Lancer le robot (vérification + actus + calendrier)
        env:
          ANCIEN_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python outils/robot.py

      - name: Numéro de version (déclenche la mise à jour sur l'iPhone)
        run: sed -i "s/const VERSION = 'dev'/const VERSION = '${GITHUB_SHA::8}'/" sw.js

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4

      # GitHub met en pause les tâches horaires d'un dépôt sans activité pendant 60 jours.
      # Une fois par semaine (le lundi), on « réactive » le robot pour éviter cette pause.
      - name: Rester actif (anti-pause des 60 jours)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date +%u)" = "1" ] && [ "$(date +%H)" = "06" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publier.yml/enable" && echo "Robot réactivé"
          fi
