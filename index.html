<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover : l'app occupe tout l'écran, y compris autour de l'encoche -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Échappée</title>
  <meta name="description" content="Cyclisme pro, matériel, parcours autour de Vesoul et météo de sortie.">

  <!-- PWA : installation sur l'écran d'accueil de l'iPhone -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0B1530">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Échappée">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <link rel="icon" href="icones/favicon-32.png">
  <!-- Écran de démarrage pour l'iPhone XR (414 × 896 points, écran ×2) -->
  <link rel="apple-touch-startup-image" href="icones/demarrage-828x1792.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

  <link rel="preload" href="polices/barlow-condensed-900-italique.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="entete">
    <div class="entete-ligne">
      <!-- Logo : le E (trois barres) = le peloton ; l'accent qui part devant = l'échappée -->
      <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
        <rect width="120" height="120" rx="27" fill="#FFD100"/>
        <g transform="skewX(-12) translate(18 0)" fill="#0B1530">
          <rect x="30" y="44" width="14" height="52"/><rect x="30" y="44" width="50" height="12"/>
          <rect x="30" y="64" width="38" height="12"/><rect x="30" y="84" width="50" height="12"/>
          <g transform="rotate(-18 67 27)" fill="#FF2E88">
            <rect x="52" y="22" width="34" height="11"/>
            <rect x="34" y="22" width="12" height="4" opacity=".7"/><rect x="38" y="29" width="8" height="4" opacity=".45"/>
          </g>
        </g>
      </svg>
      <h1 id="titre-page">Échappée</h1>
    </div>
    <div class="maillots" aria-hidden="true"></div>
  </header>

  <!-- Un <section> par onglet. Leur contenu est créé par les fichiers js/*.js -->
  <main>
    <section id="actus"    class="onglet" aria-label="Actus pro"></section>
    <section id="courses"  class="onglet" aria-label="Calendrier des courses" hidden></section>
    <section id="materiel" class="onglet" aria-label="Actus matériel" hidden></section>
    <section id="parcours" class="onglet" aria-label="Parcours" hidden></section>
    <section id="meteo"    class="onglet" aria-label="Météo" hidden></section>
  </main>

  <!-- Barre d'onglets en bas de l'écran -->
  <nav class="barre-onglets" aria-label="Navigation">
    <a href="#actus" data-onglet="actus">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13v14H6a2 2 0 0 1-2-2V5zm13 4h3v8a2 2 0 0 1-2 2h-1M7 9h7M7 13h7M7 16h4"/></svg></span>
      <span>Actus</span>
    </a>
    <a href="#courses" data-onglet="courses">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4m0 1h12l-2 4 2 4H5"/></svg></span>
      <span>Courses</span>
    </a>
    <a href="#materiel" data-onglet="materiel">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-8h6l2 8M10 8l2 8h-6M9 6h3"/></svg></span>
      <span>Matériel</span>
    </a>
    <a href="#parcours" data-onglet="parcours">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20l5-9 4 5 3-4 6 8H3z"/><circle cx="16" cy="6" r="2"/></svg></span>
      <span>Parcours</span>
    </a>
    <a href="#meteo" data-onglet="meteo">
      <span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3.5"/><path d="M9 2v1.5M2 9h1.5M4 4l1 1M14 4l-1 1M8 20h9a4 4 0 0 0 0-8 5 5 0 0 0-9.5 1.5A3.3 3.3 0 0 0 8 20z"/></svg></span>
      <span>Météo</span>
    </a>
  </nav>
</body>
</html>
